{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Datafy Verification{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f6f7f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .3px; }
    .stat-card .display-6 { font-weight: 700; }
    .step-badge { width: 1.6rem; height: 1.6rem; font-size: .8rem;
      display: inline-flex; align-items: center; justify-content: center; }
    .table-preview { font-size: .85rem; }
    .wizard-steps { list-style: none; display: flex; gap: .5rem;
      padding: 0; margin: 0 0 1.5rem; flex-wrap: wrap; }
    .wizard-steps li { padding: .35rem .8rem; border-radius: 2rem;
      background: #e9ecef; font-size: .85rem; color: #495057; }
    .wizard-steps li.active { background: #0d6efd; color: #fff; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand text-primary" href="{% url 'verifier:dashboard' %}">Datafy</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{% url 'verifier:dashboard' %}">Dashboard</a>
      <a class="nav-link" href="{% url 'verifier:history' %}">History</a>
    </div>
    <a class="btn btn-primary" href="{% url 'verifier:start' %}">+ New Verification</a>
  </div>
</nav>

<div class="container pb-5">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
